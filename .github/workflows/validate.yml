name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build catalog (validates frontmatter)
        run: node scripts/build-catalog.mjs
      - name: Check catalog.json is committed and current
        run: git diff --exit-code catalog.json
